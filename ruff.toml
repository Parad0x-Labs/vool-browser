# The same pinned linter and rule families as the main VOOL repository.
target-version = "py311"
line-length = 140

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "EXE"]
ignore = [
    "E501",  # line length is a guide here, not a gate
    "E402",  # the tools put their own folder on the path before importing each other
]
